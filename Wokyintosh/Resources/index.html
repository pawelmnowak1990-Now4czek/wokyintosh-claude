<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wokyintosh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-mac">
    <div class="boot-face">⌣</div>
    <div class="boot-slot"></div>
  </div>
  <div class="boot-text">Welcome to Macintosh.</div>
</div>

<main class="dashboard">
  <div class="crt-scan"></div>
  <div class="crt-vignette"></div>

  <header class="top">
    <section class="time-block">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date">—</div>
    </section>

    <section class="claude-card classic-box">
      <div class="eyebrow">Claude</div>
      <div class="claude-row">
        <svg id="claude-star" class="claude-star" viewBox="-1 -1 13 13" aria-hidden="true">
          <g class="star-a">
            <rect x="5" y="0" width="1" height="3"/><rect x="4" y="3" width="3" height="1"/>
            <rect x="3" y="4" width="5" height="1"/><rect x="0" y="5" width="11" height="1"/>
            <rect x="3" y="6" width="5" height="1"/><rect x="4" y="7" width="3" height="1"/>
            <rect x="5" y="8" width="1" height="3"/>
          </g>
          <g class="star-b">
            <rect x="4" y="4" width="3" height="3"/>
            <rect x="1" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/>
            <rect x="9" y="1" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/>
            <rect x="3" y="7" width="1" height="1"/><rect x="2" y="8" width="1" height="1"/><rect x="1" y="9" width="1" height="1"/>
            <rect x="7" y="7" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/>
          </g>
        </svg>
        <div id="claude-count" class="claude-count">--</div>
      </div>
      <div id="claude-caption" class="claude-caption">starting…</div>
    </section>

    <section class="weather-card classic-box">
      <div id="weather-icon" class="weather-icon"></div>
      <div>
        <div id="weather-temp" class="weather-temp">--°C</div>
        <div id="weather-text" class="weather-text">Loading...</div>
        <div id="location-name" class="weather-location">LOCAL</div>
      </div>
    </section>
  </header>

  <div class="separator"></div>

  <section class="music-card classic-box">
    <div class="album-frame">
      <img id="artwork" class="artwork hidden" alt="">
      <div id="fallback-art" class="fallback-art">
        <div class="fallback-moon"></div>
        <div class="fallback-city"></div>
        <div class="fallback-road"></div>
      </div>
      <div class="art-dither"></div>
    </div>

    <div class="music-info">
      <div class="eyebrow">Now Playing</div>
      <div id="track" class="track">Nothing playing</div>
      <div id="artist" class="artist">Music / Spotify</div>
      <div class="progress-shell"><div id="progress-bar" class="progress-fill"></div></div>
      <div class="music-bottom">
        <div class="controls"><span id="btn-prev">◀◀</span><span id="play-state">▶</span><span id="btn-next">▶▶</span></div>
        <div class="music-meta"><span id="source">—</span><span id="elapsed">00:00 / 00:00</span></div>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat classic-box">
      <div class="stat-icon">▣</div><div class="stat-label">CPU</div>
      <div id="cpu" class="stat-value">--%</div>
      <div class="mini-meter"><div id="cpu-bar" class="mini-fill"></div></div>
    </div>
    <div class="stat classic-box">
      <div class="stat-icon">▥</div><div class="stat-label">RAM</div>
      <div id="ram" class="stat-value">--%</div>
      <div class="mini-meter"><div id="ram-bar" class="mini-fill"></div></div>
    </div>
    <div class="stat classic-box">
      <div class="stat-icon">▤</div><div class="stat-label">SSD</div>
      <div id="ssd" class="stat-value">-- GB</div>
      <div class="mini-meter"><div id="ssd-bar" class="mini-fill"></div></div>
    </div>
    <div class="stat classic-box">
      <div class="stat-icon">⌁</div><div class="stat-label">NET</div>
      <div id="net" class="stat-value">--</div>
      <div class="mini-meter"><div id="net-bar" class="mini-fill"></div></div>
    </div>
  </section>

  <footer class="footer">
    <span>Wokyintosh · fork by Paweł Nowak · based on Wokyintosh by Salar Farahani</span>
    <span>Version: 1.0 (Sep. 2026)</span>
  </footer>
</main>


<script>
(function () {
  function dismissBoot() {
    var boot = document.getElementById('boot');
    if (!boot) return;
    boot.classList.add('boot-hidden');
    setTimeout(function () {
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
    }, 220);
  }

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(dismissBoot, 780);
  });

  window.addEventListener('load', function () {
    setTimeout(dismissBoot, 650);
  });

  // Last-resort fallback: no dependency on external JavaScript.
  setTimeout(dismissBoot, 1400);
})();
</script>

<script src="app.js"></script>
</body>
</html>
